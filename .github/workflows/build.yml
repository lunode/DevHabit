name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  DOTNET_VERSION: "10.x"
jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore DevHabit.slnx

      - name: Build
        run: dotnet build DevHabit.slnx --configuration Release --no-restore

      - name: Test
        # run: dotnet test DevHabit.slnx --no-build --verbosity normal --logger trx --results-directory TestResults
        run: dotnet test DevHabit.slnx --configuration Release --no-build --no-restore

      - name: Publish
        run: dotnet publish DevHabit.slnx --configuration Release --no-build --no-restore

      # - name: Test Report
      #   uses: dorny/test-reporter@v1
      #   if: success() || failure()
      #   with:
      #     name: .NET Tests
      #     path: "**/TestResults/*.trx"
      #     reporter: dotnet-trx
