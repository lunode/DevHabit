services:
  devhabit.api:
    image: ${DOCKER_REGISTRY-}devhabitapi
    build:
      context: .
      dockerfile: DevHabit.Api/Dockerfile
    environment:
      # for Seq
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://devhabit.seq:5341/ingest/otlp
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      # for Aspire
      # - OTEL_EXPORTER_OTLP_ENDPOINT=http://devhabit.aspire:18888
      # - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
    ports:
      - "5000:8080"
      - "5001:8081"
  devhabit.seq:
    image: datalust/seq:2026.1
    environment:
      ACCEP_EULA: "Y"
    volumes:
      - ./containers/seq_data:/data
    ports:
      - 8080:80
      - 5341:5341
  
